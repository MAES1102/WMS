: 1.0; stroke-dasharray: 7.0,7.0;"/><!--link Compare to GMN168--><path d="M246.71,406.5031 C216.17,398.4631 186.39,383.5031 170.5,356.0531 C149.67,320.0931 149.67,205.0131 170.5,169.0531 C183.73,146.2231 206.27,131.3831 230.85,121.7731 " fill="none" id="Compare-GMN168" style="stroke: #A80036; stroke-width: 1.0; stroke-dasharray: 7.0,7.0;"/><rect fill="#DDDDDD" height="58.8906" rx="5" ry="5" style="stroke: #000000; stroke-width: 1.0;" width="359" x="247" y="785.9531"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacingAndGlyphs" textLength="335" x="253" y="803.9482">Current requirements and final application boundary.</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacingAndGlyphs" textLength="347" x="253" y="820.2451">Logical roles only; authentication is outside scope.</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacingAndGlyphs" textLength="347" x="253" y="836.542">Implementation and acceptance evidence are maintained separately.</text><!--
@startuml
title Request Workflow — System Context and Use Cases
left to right direction
skinparam shadowing false

actor Submitter
actor Approver
actor "Workflow operator" as Operator
actor "Academic evaluator" as Evaluator

rectangle "Request workflow application" {
  usecase "Submit request" as Submit
  usecase "View request status" as Status
  usecase "Review pending request" as Review
  usecase "Approve or reject" as Decide
  usecase "Configure workflow draft" as Configure
  usecase "Validate and activate revision" as Activate
  usecase "Inspect run trace" as Trace
  usecase "Compare execution modes" as Compare
}

Submitter - -> Submit
Submitter - -> Status
Approver - -> Review
Approver - -> Decide
Operator - -> Configure
Operator - -> Activate
Operator - -> Trace
Evaluator - -> Status
Evaluator - -> Trace
Evaluator - -> Compare

Decide ..> Review : <<include>>
Activate ..> Configure : <<include>>
Compare ..> Trace : <<include>>

note bottom of Submit
One bounded structured Purchase Request payload.
No payment, external extraction, or external email.
end note

note bottom of Compare
Same revision, input, decision,
and deterministic fault schedule.
end note

legend
Current requirements and final application boundary.
Logical roles only; authentication is outside scope.
Implementation and acceptance evidence are maintained separately.
endlegend
@enduml

