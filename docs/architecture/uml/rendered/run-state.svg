ext fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="201" x="279.91" y="578.7528">REJECTED, VALIDATION_FAILED,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="184" x="279.91" y="593.8856">or NEEDS_MANUAL_ACTION.</text><!--link *start to Candidate--><path d="M823.91,48.9131 C823.91,65.5831 823.91,101.4231 823.91,126.0231 " fill="none" id="*start-Candidate" style="stroke: #A80036; stroke-width: 1.0;"/><polygon fill="#A80036" points="823.91,130.8131,827.91,121.8131,823.91,125.8131,819.91,121.8131,823.91,130.8131" style="stroke: #A80036; stroke-width: 1.0;"/><!--link Candidate to Rejected--><path d="M868.4,173.0231 C891.27,185.0831 917.85,202.6531 934.91,225.4331 C966.83,268.0331 978.48,330.8731 982.65,366.3331 " fill="none" id="Candidate-Rejected" style="stroke: #A80036; stroke-width: 1.0;"/><polygon fill="#A80036" points="983.18,371.1231,986.1794,361.7421,982.6372,366.1527,978.2267,362.6105,983.18,371.1231" style="stroke: #A80036; stroke-width: 1.0;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="118" x="946.98" y="238.5">validation violation</text><!--link Rejected to *end--><path d="M941.28,416.0231 C857.59,455.8531 678.14,541.2631 625.63,566.2531 " fill="none" id="Rejected-*end" style="stroke: #A80036; stroke-width: 1.0;"/><polygon fill="#A80036" points="621.24,568.3431,631.0851,568.0719,625.7514,566.1874,627.6359,560.8536,621.24,568.3431" style="stroke: #A80036; stroke-width: 1.0;"/><!--link Candidate to Ready--><path d="M791.23,173.0531 C755.02,193.6731 694.3,225.5331 637.91,242.4331 C544.23,270.5031 511.89,239.1731 419.91,272.4331 C412.72,275.0331 405.47,278.6631 398.7,282.6031 " fill="none" id="Candidate-Ready" style="stroke: #A80036; stroke-width: 1.0;"/><polygon fill="#A80036" points="394.44,285.1831,404.2125,283.9587,398.7212,282.6002,400.0797,277.1089,394.44,285.1831" style="stroke: #A80036; stroke-width: 1.0;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="245" x="681.4" y="238.5">revision active + submission accepted</text><!--link Ready to Waiting--><path d="M357.83,285.9431 C351.28,268.6431 340.38,243.9131 325.91,225.4331 C311.13,206.5331 290.58,189.2831 273.16,176.4131 " fill="none" id="Ready-Waiting" style="stroke: #A80036; stroke-width: 1.0;"/><polygon fill="#A80036" points="269.56,173.7931,274.4824,182.3237,273.6024,176.7357,279.1904,175.8558,269.56,173.7931" style="stroke: #A80036; stroke-width: 1.0;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="291" x="337.95" y="238.5">pending work item + waiting trace committed</text><!--link Waiting to Ready--><path d="M146.66,160.6531 C68.46,170.2031 -24.84,192.2531 16.91,242.4331 C55.17,288.3931 236.49,301.6131 321.16,305.3131 " fill="none" id="Waiting-Ready" style="stroke: #A80036; stroke-width: 1.0;"/><polygon fill="#A80036" points="326.07,305.5231,317.2376,301.1656,321.074,305.3227,316.9169,309.1592,326.07,305.5231" style="stroke: #A80036; stroke-width: 1.0;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="299" x="17.91" y="238.5">first valid decision + resume cursor committed</text><!--link Ready to Completed--><path d="M353.96,329.1531 C343.7,351.2431 331.62,387.0831 343.91,415.5531 C348.03,425.0831 355,433.6131 362.53,440.7831 " fill="none" id="Ready-Completed" style="stroke: #A80036; stroke-width: 1.0;"/><polygon fill="#A80036" points="366.15,444.0531,362.1535,435.0516,362.4399,440.7012,356.7904,440.9877,366.15,444.0531" style="stroke: #A80036; stroke-width: 1.0;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="222" x="344.91" y="398.82">handled terminal result committed</text><!--link Ready to Failed--><path d="M393.84,329.4331 C401.97,334.4931 411.02,339.4531 419.91,342.9631 C483.96,368.2431 518.44,329.5831 571.91,372.9631 C582.63,381.6531 595.16,415.1531 603.06,439.1231 " fill="none" id="Ready-Failed" style="stroke: #A80036; stroke-width: 1.0;"/><polygon fill="#A80036" points="604.6,443.8631,605.6283,434.0681,603.0575,439.107,598.0186,436.5361,604.6,443.8631" style="stroke: #A80036; stroke-width: 1.0;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="284" x="595.06" y="398.82">unhandled unsuccessful terminal committed</text><!--link Completed to *end--><path d="M434.85,485.8731 C483.38,509.9631 563.9,549.9231 596.53,566.1131 " fill="none" id="Completed-*end" style="stroke: #A80036; stroke-width: 1.0;"/><polygon fill="#A80036" points="600.69,568.1831,594.4193,560.5885,596.215,565.9528,590.8507,567.7485,600.69,568.1831" style="stroke: #A80036; stroke-width: 1.0;"/><!--link Failed to *end--><path d="M610.91,485.6331 C610.91,506.1331 610.91,538.3431 610.91,557.4731 " fill="none" id="Failed-*end" style="stroke: #A80036; stroke-width: 1.0;"/><polygon fill="#A80036" points="610.91,562.3631,614.91,553.3631,610.91,557.3631,606.91,553.3631,610.91,562.3631" style="stroke: #A80036; stroke-width: 1.0;"/><rect fill="#DDDDDD" height="42.5938" rx="5" ry="5" style="stroke: #000000; stroke-width: 1.0;" width="497" x="294" y="619.9531"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacingAndGlyphs" textLength="350" x="300" y="637.9482">Run state and request business state are separate.</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacingAndGlyphs" textLength="485" x="300" y="654.2451">Every transition commits its trace observation in the same unit of work.</text><!--
@startuml
title Request Workflow — Run and Approval Lifecycle
hide empty description
skinparam shadowing false

state "Definition candidate" as Candidate
state "Rejected definition\n(no active revision/run)" as Rejected #LightGray
state "RUNNING\nREADY" as Ready
state "WAITING_FOR_APPROVAL" as Waiting
state "COMPLETED" as Completed
state "FAILED" as Failed

[*] - -> Candidate
Candidate - -> Rejected : validation violation
Rejected - -> [*]
Candidate - -> Ready : revision active + submission accepted

Ready - -> Waiting : pending work item + waiting trace committed
Waiting - -> Ready : first valid decision + resume cursor committed
Ready - -> Completed : handled terminal result committed
Ready - -> Failed : unhandled unsuccessful terminal committed

Completed - -> [*]
Failed - -> [*]

note right of Waiting
No active EventBus subscriber.
State survives restart.
Human decision is never retried.
Identical replay changes nothing;
a conflicting later decision is rejected.
end note

note right of Ready
Cursor state version prevents
concurrent double advancement.
Retry commits an attempt and keeps the cursor READY.
A selected transition advances the cursor.
end note

note bottom of Completed
Business result may be AUTHORIZED,
REJECTED, VALIDATION_FAILED,
or NEEDS_MANUAL_ACTION.
end note

legend
Run state and request business state are separate.
Every transition commits its trace observation in the same unit of work.
endlegend
@enduml

