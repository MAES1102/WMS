ect fill="#E9F1F6" height="40" rx="5" ry="5" style="stroke:#1D567D;stroke-width:0.5;" width="90.9009" x="334.34" y="436"/><text fill="#12395B" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="80.9009" x="339.34" y="459.5103">COMPLETED</text><rect fill="#E9F1F6" height="40" rx="5" ry="5" style="stroke:#1D567D;stroke-width:0.5;" width="55.5127" x="555.03" y="436"/><text fill="#12395B" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="45.5127" x="560.03" y="459.5103">FAILED</text><g class="start_entity" data-qualified-name=".start." data-source-line="38" id="ent0007"><ellipse cx="768.79" cy="53" fill="#222222" rx="10" ry="10" style="stroke:#222222;stroke-width:1;"/></g><g class="end_entity" data-qualified-name=".end." data-source-line="40" id="ent0010"><ellipse cx="582.79" cy="561.5" fill="none" rx="11" ry="11" style="stroke:#222222;stroke-width:1;"/><ellipse cx="582.79" cy="561.5" fill="#222222" rx="6" ry="6" style="stroke:#222222;stroke-width:1;"/></g><g class="entity" data-qualified-name="GMN19" data-source-line="52" id="ent0020"><path d="M362.62,129 L362.62,157.5 L327.65,161.5 L362.62,165.5 L362.62,194 A5,5 0 0 0 367.62,199 L593.9515,199 A5,5 0 0 0 598.9515,194 L598.9515,134 L588.9515,124 L367.62,124 A5,5 0 0 0 362.62,129" fill="#FFF8E7" style="stroke:#C9A227;stroke-width:0.5;"/><path d="M588.9515,124 L588.9515,131.5 A2.5,2.5 0 0 0 591.4515,134 L598.9515,134 L588.9515,124" fill="#FFF8E7" style="stroke:#C9A227;stroke-width:0.5;"/><text fill="#5A4600" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="180.6353" x="368.62" y="139.0103">No active EventBus subscriber.</text><text fill="#5A4600" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="125.709" x="368.62" y="152.0103">State survives restart.</text><text fill="#5A4600" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="186.418" x="368.62" y="165.0103">Human decision is never retried.</text><text fill="#5A4600" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="190.0742" x="368.62" y="178.0103">Identical replay changes nothing;</text><text fill="#5A4600" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="215.3315" x="368.62" y="191.0103">a conflicting later decision is rejected.</text></g><g class="entity" data-qualified-name="GMN22" data-source-line="60" id="ent0023"><path d="M424.72,279 L424.72,301 L390.38,305 L424.72,309 L424.72,331 A5,5 0 0 0 429.72,336 L765.847,336 A5,5 0 0 0 770.847,331 L770.847,284 L760.847,274 L429.72,274 A5,5 0 0 0 424.72,279" fill="#FFF8E7" style="stroke:#C9A227;stroke-width:0.5;"/><path d="M760.847,274 L760.847,281.5 A2.5,2.5 0 0 0 763.347,284 L770.847,284 L760.847,274" fill="#FFF8E7" style="stroke:#C9A227;stroke-width:0.5;"/><text fill="#5A4600" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="169.7935" x="430.72" y="289.0103">Cursor state version prevents</text><text fill="#5A4600" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="189.3442" x="430.72" y="302.0103">concurrent double advancement.</text><text fill="#5A4600" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="325.127" x="430.72" y="315.0103">Retry commits an attempt and keeps the cursor READY.</text><text fill="#5A4600" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="241.3506" x="430.72" y="328.0103">A selected transition advances the cursor.</text></g><g class="entity" data-qualified-name="GMN25" data-source-line="67" id="ent0026"><path d="M256.23,542 L256.23,581 A5,5 0 0 0 261.23,586 L498.3462,586 A5,5 0 0 0 503.3462,581 L503.3462,547 L493.3462,537 L383.79,537 L379.79,476.47 L375.79,537 L261.23,537 A5,5 0 0 0 256.23,542" fill="#FFF8E7" style="stroke:#C9A227;stroke-width:0.5;"/><path d="M493.3462,537 L493.3462,544.5 A2.5,2.5 0 0 0 495.8462,547 L503.3462,547 L493.3462,537" fill="#FFF8E7" style="stroke:#C9A227;stroke-width:0.5;"/><text fill="#5A4600" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="226.1162" x="262.23" y="552.0103">Business result may be AUTHORIZED,</text><text fill="#5A4600" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="209.4917" x="262.23" y="565.0103">REJECTED, VALIDATION_FAILED,</text><text fill="#5A4600" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="181.3208" x="262.23" y="578.0103">or NEEDS_MANUAL_ACTION.</text></g><!--link *start* to Candidate--><g class="link" data-entity-1="ent0007" data-entity-2="ent0001" data-link-type="dependency" data-source-line="38" id="lnk8"><path d="M768.79,63.45 C768.79,80.86 768.79,113.31 768.79,136.27" fill="none" id="*start*-to-Candidate" style="stroke:#326D91;stroke-width:1.3;"/><polygon fill="#326D91" points="768.79,141.27,772.79,132.27,768.79,136.27,764.79,132.27,768.79,141.27" style="stroke:#326D91;stroke-width:1.3;stroke-linejoin:miter;stroke-miterlimit:10;"/></g><!--link Candidate to Rejected--><g class="link" data-entity-1="ent0001" data-entity-2="ent0002" data-link-type="dependency" data-source-line="39" id="lnk9"><path d="M804.52,181.83 C822.96,193.38 844.52,209.59 858.79,229 C890.19,271.72 903.5506,329.2444 909.0206,360.5944" fill="none" id="Candidate-to-Rejected" style="stroke:#326D91;stroke-width:1.3;"/><polygon fill="#326D91" points="909.88,365.52,912.2735,355.9664,909.0206,360.5944,904.3926,357.3415,909.88,365.52" style="stroke:#326D91;stroke-width:1.3;stroke-linejoin:miter;stroke-miterlimit:10;"/><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="106.2344" x="868.6" y="240.0103">validation violation</text></g><!--link Rejected to *end*--><g class="link" data-entity-1="ent0002" data-entity-2="ent0010" data-link-type="dependency" data-source-line="40" id="lnk11"><path d="M875.89,406.4 C800.88,445.84 638.5658,531.1736 596.8258,553.1136" fill="none" id="Rejected-to-*end*" style="stroke:#326D91;stroke