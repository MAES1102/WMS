@startuml
title Request Workflow — Single-Service Deployment View
skinparam shadowing false

node "User device" as Client {
  artifact "Browser" as Browser
}

node "Application host" as Host {
  node "One FastAPI application process" as App {
    component "HTTP + static UI" as HTTP
    component "Application/domain modules" as Core
    component "Run-scoped in-memory EventBus" as EventBus
    component "Persistence adapters" as Persistence
    component "Structured request boundary" as StructuredBoundary
    component "Domain validation rules" as ValidationRules <<library>>
  }
}

database "SQLite workflow.db" as Database
folder "Persistent workflow data" as Storage

Browser - -> HTTP : client-server requests
HTTP - -> Core : in-process use cases
Core - -> EventBus : in-process choreography triggers
Core - -> Persistence : transactions and queries
Core - -> StructuredBoundary : structured request validation
Persistence - -> Database : definitions, requests, runs,\napprovals, attempts, notifications, trace
StructuredBoundary - -> Storage : request and workflow records
StructuredBoundary - -> ValidationRules : field validation rules

note right of App
Orchestration and choreography share this process.
Restart recovery reads persistent cursors.
EventBus holds no waiting state.
end note

note bottom of Storage
Structured JSON data only.
No external business service.
end note

note "Absent: Kafka, ZooKeeper, distributed broker,\nmicroservices, external workflow engine,\npayment/accounting system, external email." as Exclusions

legend
Local start and Compose use this single-service boundary.
Runtime files are persistent and untracked by Git.
endlegend
@enduml

