services:
  app:
    image: python:3.12-slim
    working_dir: /code
    volumes:
      - .:/code
    ports:
      - "8000:8000"
    environment:
      PYTHONPATH: /code
    command: >
      sh -c "pip install --no-cache-dir -r requirements.txt &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000"
